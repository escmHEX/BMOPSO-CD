[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-mopso-cd"
version = "0.1.0"
description = "Binary MOPSO-CD semantic prompt optimizer using Ollama and SBERT."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "ESCM" }]
dependencies = [
  "numpy>=2.2",
  "pandas>=2.2",
  "PyYAML>=6.0.2",
  "scikit-learn>=1.6",
  "ollama>=0.5.0",
  "httpx>=0.28",
]

[project.optional-dependencies]
models = [
  "sentence-transformers>=4.1",
  "transformers>=4.51",
  "torch>=2.7",
  "spacy>=3.8",
  "nltk>=3.9",
  "pymoo>=0.6.1.3",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

[project.scripts]
binary-mopso-cd = "binary_mopso_cd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

