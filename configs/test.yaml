experiment:
  n: 4
  iterations: 2
  runs: 1
  seed: 7
  domain: "social media messages related to crises and emergencies"
  components: ["role", "topic", "action"]
  frozen_components: []

runtime:
  outdir_base: "exec_test"

checkpoint:
  enabled: false

models:
  sbert:
    default: "all-MiniLM-L6-v2"
    batch_size: 16
    config_version: "sbert-test-v1"
  ppdb:
    enabled: true
    source_path: "tests/fixtures/ppdb_sample.txt"
    index_path: "{venv}/var/binary_mopso_cd/pytest_ppdb_index.sqlite"

selection:
  enabled: true
  k: 2

monitor:
  enabled: false
