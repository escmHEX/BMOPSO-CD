experiment:
  n: 100
  iterations: 100
  runs: 3
  seed: 42
  domain: "social media messages related to crises and emergencies"
  components: ["role", "topic", "action"]
  frozen_components: []

runtime:
  outdir_base: "exec"
  resume_from: null
  embedding_cache_file: "embedding_cache.json"
  eager_load_models: true

parallelism:
  enabled: true
  particle_update_max_concurrent: 10
  initial_text_generation_max_concurrent: 10

checkpoint:
  enabled: false
  interval: 1
  directory: "checkpoints"

ollama:
  host: "http://127.0.0.1:11434"
  timeout_seconds: 120
  default_model: "llama3.1:8b"
  alternative_model: "qwen3.5:2b"
  model_options:
    - "llama3"
    - "llama3.1:8b"
    - "qwen3.5:2b"
    - "qwen3:4b-instruct-2507-q4_K_M"
    - "phi4-mini"
    - "ministral-3:3b"
    - "gemma4:e4b"
    - "qwen3.5:4b"
    - "qwen3.5:9b"
    - "lfm2.5:8b"
  model_capabilities:
    llama3:
      thinking: false
      validated_thinking_tasks: []
    llama3.1:8b:
      thinking: false
      validated_thinking_tasks: []
    qwen3.5:2b:
      thinking: true
      validated_thinking_tasks: []
    qwen3:4b-instruct-2507-q4_K_M:
      thinking: true
      validated_thinking_tasks: []
    phi4-mini:
      thinking: false
      validated_thinking_tasks: []
    ministral-3:3b:
      thinking: false
      validated_thinking_tasks: []
    gemma4:e4b:
      thinking: true
      validated_thinking_tasks:
        - semantic_anchor_extraction
        - semantic_pool_generation
    qwen3.5:4b:
      thinking: true
      validated_thinking_tasks: []
    qwen3.5:9b:
      thinking: true
      validated_thinking_tasks:
        - semantic_anchor_extraction
    lfm2.5:8b:
      thinking: true
      validated_thinking_tasks:
        - semantic_anchor_extraction
        - semantic_pool_generation
  model_profiles:
    default:
      response_thinking:
        strip_content_tags: false
        start_tag: "<think>"
        end_tag: "</think>"
    lfm2.5:8b:
      response_thinking:
        strip_content_tags: true
  stream: false
  think: false
  speculative_decoding_enabled: false

models:
  sbert:
    default: "all-MiniLM-L6-v2"
    alternatives:
      all-MiniLM-L6-v2: "sentence-transformers/all-MiniLM-L6-v2"
      gte-small: "thenlper/gte-small"
    batch_size: 64
    config_version: "sbert-v1"
  distilbert:
    model: "distilbert-base-uncased"
    top_k_multiplier: 3
  spacy:
    model: "en_core_web_sm"
  wordnet:
    enabled: true
  ppdb:
    enabled: true
    source_path: "data/ppdb/ppdb-2.0-s-all"
    index_path: "{venv}/var/binary_mopso_cd/ppdb_index.sqlite"

logging:
  enabled: true
  console: true
  file: "runtime.log"
  level: "INFO"

router:
  task_models:
    semantic_anchor_extraction: "llama3.1:8b"
    central_anchor_selection: "gemma4:e4b"
    semantic_pool_generation: "llama3.1:8b"
    semantic_pool_expansion: "llama3.1:8b"
    semantic_component_influence_candidates: "llama3.1:8b"
    synthetic_text_generation: "llama3.1:8b"
  phase_task_models:
    initialization:
      semantic_anchor_extraction: null
      central_anchor_selection: null
      semantic_pool_generation: null
      semantic_pool_expansion: null
      semantic_component_influence_candidates: null
      synthetic_text_generation: null
    optimization:
      semantic_anchor_extraction: null
      central_anchor_selection: null
      semantic_pool_generation: null
      semantic_pool_expansion: null
      semantic_component_influence_candidates: null
      synthetic_text_generation: null
  task_thinking:
    semantic_anchor_extraction: null
    central_anchor_selection: high
    semantic_pool_generation: null
    semantic_pool_expansion: null
    semantic_component_influence_candidates: null
    synthetic_text_generation: null
  heuristics:
    semantic_anchor_extraction: true
    central_anchor_selection: true
    semantic_pool_generation: true
    semantic_pool_expansion: true
    semantic_component_influence_candidates: true
    word_replacement_candidates: true
  llm_params:
    disabled_default:
      temperature: 0.60
      top_p: 0.90
      thinking: false
    semantic_anchor_extraction:
      short_word_threshold: 6
      short:
        temperature: 0.25
        top_p: 0.90
        thinking: false
      long:
        temperature: 0.20
        top_p: 0.85
        thinking: false
    central_anchor_selection:
      temperature: 0.60
      top_p: 0.90
      thinking: false
    semantic_pool_generation:
      low_evidence_word_threshold: 6
      low_evidence_anchor_threshold: 4
      components:
        role:
          low_evidence:
            temperature: 0.68
            top_p: 0.95
            thinking: false
          normal:
            temperature: 0.60
            top_p: 0.90
            thinking: false
        topic:
          low_evidence:
            temperature: 0.42
            top_p: 0.90
            thinking: false
          normal:
            temperature: 0.40
            top_p: 0.89
            thinking: false
        action:
          low_evidence:
            temperature: 0.58
            top_p: 0.94
            thinking: false
          normal:
            temperature: 0.50
            top_p: 0.90
            thinking: false
    semantic_component_influence_candidates:
      temperature_start: 0.70
      temperature_end: 0.50
      top_p_start: 0.95
      top_p_end: 0.90
      thinking: false
    synthetic_text_generation:
      temperature: 0.75
      top_p: 0.95
      thinking: false

semantic_components:
  order: ["role", "topic", "action"]
  expansion_order: ["role", "action", "topic"]
  rules:
    role:
      alpha: 1.4
      max_words: 6
    topic:
      alpha: 1.0
      max_words: 8
    action:
      alpha: 1.2
      max_words: 6

initialization:
  candidate_multiplier: 4
  min_product_multiplier: 3
  prompt_reduction_multiplier: 2
  generated_sentences_min: 1
  generated_sentences_max: 4

generated_text_validation:
  tau_gen_min: 0.05

mopso:
  archive_multiplier: 0.7
  leader_tournament_size: 5
  dmax: 1
  kcand: 6
  omega_max: 0.9
  omega_min: 0.4
  c1: 1.5
  c2: 1.5
  vmax: 4.0
  alpha: 1
  p_tur_max: 0.08
  p_tur_min: 0.02
  p_anchor_enabled: true
  p_anchor_min: 0.05
  p_anchor_max: 0.4
  k_retry: 0
  tau_dup: 0.92
  tau_tur_min: 0.6
  tau_tur_max: 0.85
  guided_trajectory_validation_enabled: true
  guided_trajectory_relative_margin: 0.8
  guided_candidate_diagnostics_enabled: true
  guided_candidate_rejection_count_reasons:
    empty_candidate: false
    duplicate_candidate_output: false
    literal_copy_current: false
    literal_copy_target: false
    too_many_words: false
    semantic_duplicate: false
    no_semantic_progress: false
    guided_trajectory_inconsistent: true
  utility_weights:
    f1: 0.5
    f2: 0.5

selection:
  enabled: true
  k: 5
  tau_min: 0.20
  tau_max: 0.94
  lambda_mmr: 0.35
  epsilon: 0.0001

monitor:
  enabled: true
